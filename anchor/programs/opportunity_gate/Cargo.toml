[package]
name = "opportunity-gate"
version = "0.1.0"
description = "On-chain policy registry and access receipts for SkillBridge Vietnam"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "opportunity_gate"

[features]
